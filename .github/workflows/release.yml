name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t pl-section-sync-dev .devcontainer
      - name: Verify and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          docker run --rm --init --user "$(id -u):$(id -g)"
          -e npm_config_cache=/tmp/npm-cache -e RELEASE_TAG
          --mount "type=bind,source=$PWD,target=/workspace"
          pl-section-sync-dev sh -c 'npm ci && npm run verify && node scripts/release.mjs'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip --verify-tag --title "$RELEASE_TAG" --notes-file release/notes.md
